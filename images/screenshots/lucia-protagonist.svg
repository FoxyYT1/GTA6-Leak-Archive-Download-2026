<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="spotlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff0080;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0a0a"/>
  
  <!-- Spotlight -->
  <ellipse cx="400" cy="225" rx="300" ry="200" fill="url(#spotlight)" opacity="0.6"/>
  
  <!-- Character silhouette -->
  <g fill="#1a1a1a" stroke="#ff0080" stroke-width="3">
    <!-- Head -->
    <circle cx="400" cy="150" r="50"/>
    
    <!-- Body -->
    <rect x="360" y="200" width="80" height="120" rx="10"/>
    
    <!-- Arms -->
    <rect x="310" y="210" width="50" height="20" rx="10" transform="rotate(-20 335 220)"/>
    <rect x="440" y="210" width="50" height="20" rx="10" transform="rotate(20 465 220)"/>
    
    <!-- Legs -->
    <rect x="370" y="320" width="25" height="90" rx="8"/>
    <rect x="405" y="320" width="25" height="90" rx="8"/>
  </g>
  
  <!-- Neon effects -->
  <circle cx="400" cy="150" r="52" fill="none" stroke="#ff0080" stroke-width="2" opacity="0.5">
    <animate attributeName="r" values="52;58;52" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ff0080" text-anchor="middle" style="text-shadow: 0 0 15px #ff0080;">
    LUCIA
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="85" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">
    First Female GTA Protagonist
  </text>
  
  <!-- Info boxes -->
  <g fill="#1a1a1a" stroke="#00ff88" stroke-width="2">
    <rect x="50" y="360" width="150" height="60" rx="5"/>
    <rect x="220" y="360" width="150" height="60" rx="5"/>
    <rect x="430" y="360" width="150" height="60" rx="5"/>
    <rect x="600" y="360" width="150" height="60" rx="5"/>
  </g>
  
  <g font-family="Arial, sans-serif" fill="#00ff88" font-size="14" text-anchor="middle">
    <text x="125" y="385">HACKING</text>
    <text x="125" y="405" font-size="10">Expert Level</text>
    
    <text x="295" y="385">STEALTH</text>
    <text x="295" y="405" font-size="10">Master</text>
    
    <text x="505" y="385">AGILITY</text>
    <text x="505" y="405" font-size="10">Enhanced</text>
    
    <text x="675" y="385">COMBAT</text>
    <text x="675" y="405" font-size="10">Professional</text>
  </g>
  
  <!-- GTA 6 Logo -->
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff0080" text-anchor="middle" style="text-shadow: 0 0 10px #ff0080;">
    GTA VI LEAK ARCHIVE - CYBERLEAKGTA6.COM
  </text>
</svg>
