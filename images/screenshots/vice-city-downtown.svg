<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#001a33;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004d80;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>
  
  <!-- Buildings -->
  <rect x="50" y="150" width="100" height="300" fill="url(#buildingGrad)" stroke="#00ff88" stroke-width="2"/>
  <rect x="180" y="100" width="120" height="350" fill="url(#buildingGrad)" stroke="#00ff88" stroke-width="2"/>
  <rect x="330" y="80" width="90" height="370" fill="url(#buildingGrad)" stroke="#00ff88" stroke-width="2"/>
  <rect x="450" y="120" width="110" height="330" fill="url(#buildingGrad)" stroke="#00ff88" stroke-width="2"/>
  <rect x="590" y="140" width="100" height="310" fill="url(#buildingGrad)" stroke="#00ff88" stroke-width="2"/>
  
  <!-- Windows -->
  <g fill="#ffaa00" opacity="0.8">
    <rect x="65" y="170" width="15" height="20"/>
    <rect x="90" y="170" width="15" height="20"/>
    <rect x="115" y="170" width="15" height="20"/>
    <rect x="65" y="210" width="15" height="20"/>
    <rect x="90" y="210" width="15" height="20"/>
    <rect x="115" y="210" width="15" height="20"/>
    
    <rect x="200" y="130" width="15" height="20"/>
    <rect x="225" y="130" width="15" height="20"/>
    <rect x="250" y="130" width="15" height="20"/>
    <rect x="275" y="130" width="15" height="20"/>
    
    <rect x="350" y="110" width="12" height="18"/>
    <rect x="370" y="110" width="12" height="18"/>
    <rect x="390" y="110" width="12" height="18"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#00ff88" text-anchor="middle" style="text-shadow: 0 0 10px #00ff88;">
    VICE CITY - DOWNTOWN
  </text>
  
  <!-- GTA 6 Logo -->
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ff0080" text-anchor="middle" style="text-shadow: 0 0 10px #ff0080;">
    GTA VI LEAK ARCHIVE
  </text>
</svg>
