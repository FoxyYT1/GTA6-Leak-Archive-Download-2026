<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="alarmRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#330000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#660000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#330000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with alarm -->
  <rect width="800" height="450" fill="url(#alarmRed)">
    <animate attributeName="fill-opacity" values="0.8;1;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Bank vault door -->
  <g>
    <circle cx="400" cy="225" r="120" fill="#1a1a1a" stroke="#00d4ff" stroke-width="8"/>
    <circle cx="400" cy="225" r="90" fill="#0a0a0a" stroke="#00d4ff" stroke-width="4"/>
    
    <!-- Vault wheel -->
    <g stroke="#00d4ff" stroke-width="3" fill="none">
      <line x1="400" y1="225" x2="480" y2="225"/>
      <line x1="400" y1="225" x2="400" y2="145"/>
      <line x1="400" y1="225" x2="340" y2="275"/>
      <circle cx="480" cy="225" r="15" fill="#00d4ff"/>
      <circle cx="400" cy="145" r="15" fill="#00d4ff"/>
      <circle cx="340" cy="275" r="15" fill="#00d4ff"/>
    </g>
    
    <!-- Center -->
    <circle cx="400" cy="225" r="25" fill="#00d4ff">
      <animate attributeName="r" values="25;30;25" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Money bags -->
  <g fill="#1a8800" stroke="#00ff88" stroke-width="2">
    <ellipse cx="150" cy="380" rx="40" ry="50"/>
    <ellipse cx="220" cy="390" rx="35" ry="45"/>
    <ellipse cx="280" cy="385" rx="38" ry="48"/>
    
    <ellipse cx="520" cy="390" rx="35" ry="45"/>
    <ellipse cx="580" cy="385" rx="38" ry="48"/>
    <ellipse cx="650" cy="380" rx="40" ry="50"/>
  </g>
  
  <!-- Dollar signs on bags -->
  <g fill="#00ff88" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    <text x="150" y="390" text-anchor="middle">$</text>
    <text x="220" y="400" text-anchor="middle">$</text>
    <text x="280" y="395" text-anchor="middle">$</text>
    <text x="520" y="400" text-anchor="middle">$</text>
    <text x="580" y="395" text-anchor="middle">$</text>
    <text x="650" y="390" text-anchor="middle">$</text>
  </g>
  
  <!-- Alarm lights -->
  <g>
    <circle cx="100" cy="50" r="20" fill="#ff0000" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="50" r="20" fill="#ff0000" opacity="0.8">
      <animate attributeName="opacity" values="1;0.3;1" dur="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Title -->
  <rect x="250" y="10" width="300" height="50" fill="#000000" opacity="0.8" rx="5"/>
  <text x="400" y="45" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#00d4ff" text-anchor="middle" style="text-shadow: 0 0 15px #00d4ff;">
    BANK HEIST
  </text>
  
  <!-- Mission info -->
  <rect x="50" y="100" width="200" height="80" fill="#000000" opacity="0.9" rx="5" stroke="#00d4ff" stroke-width="2"/>
  <g fill="#ffffff" font-family="Arial, sans-serif" font-size="14">
    <text x="150" y="125" text-anchor="middle" fill="#00d4ff" font-weight="bold">MISSION STATUS</text>
    <text x="70" y="145"><¯ Objective: Crack Vault</text>
    <text x="70" y="165">ñ Time: 05:47</text>
  </g>
  
  <!-- Player icons -->
  <rect x="550" y="100" width="200" height="80" fill="#000000" opacity="0.9" rx="5" stroke="#ff0080" stroke-width="2"/>
  <g fill="#ffffff" font-family="Arial, sans-serif" font-size="14">
    <text x="650" y="125" text-anchor="middle" fill="#ff0080" font-weight="bold">TEAM</text>
    <text x="570" y="145">=i Lucia: Hacker</text>
    <text x="570" y="165">=h Jason: Security</text>
  </g>
  
  <!-- GTA 6 Logo -->
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#00d4ff" text-anchor="middle" style="text-shadow: 0 0 10px #00d4ff;">
    GTA VI BANK HEIST MISSION - EARLY GAMEPLAY FOOTAGE
  </text>
</svg>
