<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffaa00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="300" fill="#001a33"/>
  
  <!-- Road -->
  <rect y="300" width="800" height="150" fill="url(#roadGrad)"/>
  
  <!-- Road lines -->
  <g stroke="#ffaa00" stroke-width="4" stroke-dasharray="20,20">
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>
  
  <!-- Main car (sports car) -->
  <g transform="translate(250, 280)">
    <!-- Body -->
    <ellipse cx="100" cy="50" rx="120" ry="40" fill="url(#carGrad)" stroke="#000000" stroke-width="3"/>
    <rect x="20" y="20" width="160" height="40" fill="url(#carGrad)" stroke="#000000" stroke-width="3" rx="10"/>
    
    <!-- Windshield -->
    <path d="M 60 25 L 80 15 L 120 15 L 140 25 Z" fill="#00d4ff" opacity="0.6" stroke="#000000" stroke-width="2"/>
    
    <!-- Wheels -->
    <g fill="#1a1a1a" stroke="#ffaa00" stroke-width="3">
      <circle cx="40" cy="70" r="18"/>
      <circle cx="160" cy="70" r="18"/>
      <circle cx="40" cy="70" r="10" fill="#333333"/>
      <circle cx="160" cy="70" r="10" fill="#333333"/>
    </g>
    
    <!-- Lights -->
    <ellipse cx="20" cy="40" rx="8" ry="5" fill="#ffff00" opacity="0.9">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="180" cy="40" rx="8" ry="5" fill="#ff0000" opacity="0.8"/>
    
    <!-- Speed lines -->
    <g stroke="#ffaa00" stroke-width="2" opacity="0.6">
      <line x1="-20" y1="30" x2="-50" y2="30">
        <animate attributeName="x1" values="-20;-80" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="-50;-110" dur="0.5s" repeatCount="indefinite"/>
      </line>
      <line x1="-25" y1="45" x2="-60" y2="45">
        <animate attributeName="x1" values="-25;-90" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="-60;-125" dur="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="-15" y1="60" x2="-45" y2="60">
        <animate attributeName="x1" values="-15;-70" dur="0.4s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="-45;-100" dur="0.4s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>
  
  <!-- Vehicle stats panel -->
  <g>
    <rect x="20" y="20" width="250" height="220" fill="#000000" opacity="0.9" rx="10" stroke="#ffaa00" stroke-width="3"/>
    
    <text x="145" y="50" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffaa00" text-anchor="middle">VEHICLE STATS</text>
    
    <g fill="#ffffff" font-family="Arial, sans-serif" font-size="14">
      <text x="40" y="80">🏎️ Name: Infernus 2.0</text>
      <text x="40" y="105">💨 Top Speed: 245 mph</text>
      <text x="40" y="130">⚡ 0-60 mph: 2.3s</text>
      <text x="40" y="155">🎯 Handling: 95/100</text>
      <text x="40" y="180">💪 Durability: 80/100</text>
      <text x="40" y="205">⭐ Rarity: Legendary</text>
    </g>
  </g>
  
  <!-- Physics info -->
  <g>
    <rect x="530" y="20" width="250" height="140" fill="#000000" opacity="0.9" rx="10" stroke="#00ff88" stroke-width="3"/>
    
    <text x="655" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#00ff88" text-anchor="middle">IMPROVED PHYSICS</text>
    
    <g fill="#ffffff" font-family="Arial, sans-serif" font-size="13">
      <text x="550" y="80">✅ Realistic damage model</text>
      <text x="550" y="105">✅ Dynamic suspension</text>
      <text x="550" y="130">✅ Advanced tire grip</text>
    </g>
  </g>
  
  <!-- Vehicle count -->
  <rect x="530" y="180" width="250" height="80" fill="#000000" opacity="0.9" rx="10" stroke="#ff0080" stroke-width="3"/>
  <text x="655" y="215" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ff0080" text-anchor="middle">150+</text>
  <text x="655" y="240" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Vehicles in Leak Archive</text>
  
  <!-- Title -->
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffaa00" text-anchor="middle" style="text-shadow: 0 0 10px #ffaa00;">
    GTA VI VEHICLE SHOWCASE - ADVANCED PHYSICS ENGINE
  </text>
</svg>
