<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA 6 Leak Archive Banner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Pricedown', 'Arial Black', sans-serif;
        }
        
        .banner {
            width: 1200px;
            height: 300px;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            position: relative;
            overflow: hidden;
            border: 3px solid #00ff88;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.5),
                        inset 0 0 60px rgba(0, 255, 136, 0.1);
        }
        
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 136, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridPulse 3s ease-in-out infinite;
        }
        
        @keyframes gridPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        
        .title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
        }
        
        .title h1 {
            font-size: 72px;
            font-weight: 900;
            color: #fff;
            text-shadow: 
                0 0 10px #00ff88,
                0 0 20px #00ff88,
                0 0 30px #00ff88,
                0 0 40px #00ff88,
                4px 4px 0 #000;
            letter-spacing: 4px;
            margin-bottom: 10px;
            animation: neonPulse 2s ease-in-out infinite;
        }
        
        @keyframes neonPulse {
            0%, 100% {
                text-shadow: 
                    0 0 10px #00ff88,
                    0 0 20px #00ff88,
                    0 0 30px #00ff88,
                    0 0 40px #00ff88,
                    4px 4px 0 #000;
            }
            50% {
                text-shadow: 
                    0 0 20px #00ff88,
                    0 0 30px #00ff88,
                    0 0 40px #00ff88,
                    0 0 60px #00ff88,
                    4px 4px 0 #000;
            }
        }
        
        .title h2 {
            font-size: 32px;
            color: #ff0080;
            text-shadow: 
                0 0 10px #ff0080,
                0 0 20px #ff0080,
                2px 2px 0 #000;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        
        .badges {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .badge {
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid #00ff88;
            padding: 8px 16px;
            border-radius: 20px;
            color: #00ff88;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }
        
        .corner-accent {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 3px solid #ff0080;
        }
        
        .corner-accent.top-left {
            top: 10px;
            left: 10px;
            border-right: none;
            border-bottom: none;
            box-shadow: -5px -5px 20px rgba(255, 0, 128, 0.5);
        }
        
        .corner-accent.bottom-right {
            bottom: 10px;
            right: 10px;
            border-left: none;
            border-top: none;
            box-shadow: 5px 5px 20px rgba(255, 0, 128, 0.5);
        }
        
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
            animation: float 10s linear infinite;
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-300px) translateX(100px);
                opacity: 0;
            }
        }
        
        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 2s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 4s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 1s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 3s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 5s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 2.5s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 4.5s; }
        .particle:nth-child(9) { left: 90%; animation-delay: 1.5s; }
    </style>
</head>
<body>
    <div class="banner">
        <div class="grid-overlay"></div>
        
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
        
        <div class="corner-accent top-left"></div>
        <div class="corner-accent bottom-right"></div>
        
        <div class="title">
            <h1>GTA 6 LEAK ARCHIVE</h1>
            <h2>🔓 CyberLeak 2026 | Complete Collection</h2>
            <div class="badges">
                <span class="badge">🎮 90+ Videos</span>
                <span class="badge">💻 Source Code</span>
                <span class="badge">🚀 GTA 6 Launcher</span>
            </div>
        </div>
    </div>
</body>
</html>
